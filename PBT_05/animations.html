<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B2 - CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <div class="container">
        <h1>Hiệu ứng CSS</h1>
        
        <section>
            <h2>1. Hover Transition</h2>
            <button class="btn-hover">Hover Me</button>
        </section>

        <section>
            <h2>2. Loading Spinner (Infinite Animation)</h2>
            <div class="spinner"></div>
        </section>

        <section>
            <h2>3. Bouncing Ball</h2>
            <div class="ball"></div>
        </section>

        <section>
            <h2>4. Fade In Entrance</h2>
            <div class="fade-box">Welcome!</div>
        </section>
    </div>
</body>
</html>
