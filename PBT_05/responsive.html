<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B1 - Responsive Layout</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header>
        <h1>My Responsive Website</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="container">
        <aside class="sidebar-left">
            <h2>Sidebar Left</h2>
            <p>Nội dung bên trái.</p>
        </aside>

        <section class="content">
            <h2>Main Content</h2>
            <p>Đây là phần nội dung chính của trang web. Nó sẽ thay đổi kích thước linh hoạt theo màn hình.</p>
            <div class="grid">
                <div class="card">Item 1</div>
                <div class="card">Item 2</div>
                <div class="card">Item 3</div>
                <div class="card">Item 4</div>
            </div>
        </section>

        <aside class="sidebar-right">
            <h2>Sidebar Right</h2>
            <p>Nội dung bên phải.</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Vu Truong Giang</p>
    </footer>
</body>
</html>
