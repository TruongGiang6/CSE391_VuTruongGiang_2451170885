<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID LAYOUT</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="app-layout">

        <header class="header">
            <h1>LOGO</h1>
        </header>

        <section class="hero">
            <div class="hero-content">
                <h2>SUPER SALE</h2>
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <div class="filter-group">
                <h4>Danh mục</h4>
                <label><input type="checkbox"> Điện thoại</label>
                <label><input type="checkbox"> Laptop</label>
                <label><input type="checkbox"> Phụ kiện</label>
            </div>
            <div class="filter-group">
                <h4>Giá</h4>
                <label><input type="checkbox"> Dưới 1 triệu</label>
                <label><input type="checkbox"> 1 - 5 triệu</label>
                <label><input type="checkbox"> Trên 5 triệu</label>
            </div>
        </aside>

        <main class="main-content">
            <div class="product-grid">
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 1</h4>
                    <p>100.000 đ</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 2</h4>
                    <p>200.000 đ</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 3</h4>
                    <p>300.000 đ</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 4</h4>
                    <p>400.000 đ</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 5</h4>
                    <p>500.000 đ</p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200" alt="Product">
                    <h4>Sản phẩm 6</h4>
                    <p>600.000 đ</p>
                </div>
            </div>
        </main>

        <aside class="ads">
            <h3>Tài trợ</h3>
            <img src="https://via.placeholder.com/160x400?text=Banner+Quang+Cao" alt="Ads">
        </aside>
    </div>
</body>
</html>
