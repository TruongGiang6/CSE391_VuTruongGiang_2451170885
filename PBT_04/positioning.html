<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSITIONING</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <header class="header">
        <div class="logo">LOGO</div>
        <nav class="nav">
            <ul>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>SIDEBAR</h3>
            <ul>
                <li><a href="#">ĐIỆN THOẠI</a></li>
                <li><a href="#">LAPTOP</a></li>
                <li><a href="#">PHỤ KIỆN</a></li>
            </ul>
        </aside>

        <main class="content">
            <h2>BEST SELLER</h2>
            
            <div class="product-grid">
                <div class="product-card">
                    <span class="badge">HOT</span>
                    <img src="https://cdn.hstatic.net/products/1000359786/102_b39e657be50a40cfb35f4d2a29e8f523_master.jpg" alt="IPHONE 14 PRO MAX">
                    <h3>IPHONE 14 PRO MAX</h3>
                    <p>Giá: 30.000.000đ</p>
                </div>

                <div class="product-card">
                    <img src="https://cdn.tgdd.vn/Products/Images/42/249948/samsung-galaxy-s-ultra-tim-11-750x500.jpg" alt="SAMSUNG GALAXY S23 ULTRA">
                    <h3>SAMSUNG GALAXY S23 ULTRA</h3>
                    <p>Giá: 28.000.000đ</p>
                </div>
            </div>

            <div class="check-scroll">
                <div style="height: 1500px"></div>
            </div>
        </main>
    </div>

    <button class="scroll-top-btn" >↑</button>

</body>
</html>
